<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance en cours</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }
        .contact-info {
            font-size: 1em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/Logooriginal.png" alt="Logo JM Voyager" class="logo">
        <h1>Page en Maintenance</h1>
        <p>Nous travaillons actuellement sur ce site pour vous offrir la meilleure expérience possible. Merci de votre patience.</p>
        <p class="contact-info">Pour plus d'informations, contactez-nous à : <a href="mailto:contact@jm-voyager.fr">contact@jm-voyager.fr</a></p>
    </div>
</body>
</html>
